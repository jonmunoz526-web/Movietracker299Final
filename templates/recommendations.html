{% extends "base.html" %}
{% block title %}For You — CineMatch{% endblock %}

{% block content %}
<div class="page-header">
  <h1><span class="page-icon">✦</span> For You</h1>
  <a href="/profile" class="btn btn-ghost btn-sm">⚙ Preferences</a>
</div>

<!-- Filters -->
<div class="card" style="margin-bottom:28px;">
  <div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;">
    <div class="form-group" style="margin:0;flex:1;min-width:150px;">
      <label>Mood</label>
      <select id="moodFilter">
        <option value="">Any mood</option>
        {% for mood in all_moods %}
        <option value="{{ mood }}">{{ mood.replace('-',' ').title() }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group" style="margin:0;flex:1;min-width:150px;">
      <label>Genre</label>
      <select id="genreFilter">
        <option value="">Any genre</option>
        {% for genre in all_genres %}
        <option value="{{ genre }}">{{ genre }}</option>
        {% endfor %}
      </select>
    </div>
    <button class="btn btn-primary" onclick="loadRecs()">Get Recommendations</button>
    <button class="btn btn-ghost" id="refreshBtn" onclick="loadRecs()" style="display:none;">↻ Shuffle</button>
  </div>
  <div class="text-muted text-sm mt-8">
    Picks 5 random movies from TMDB — excludes anything you've already logged.
  </div>
</div>

<div id="recStatus"></div>
<div id="recResults"></div>

<!-- Log Modal -->
<div class="modal-overlay" id="logModal">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h2 id="logModalTitle">Log Movie</h2>
        <div class="text-muted text-sm mt-8" id="logModalYear"></div>
      </div>
      <button class="modal-close" onclick="closeModal('logModal')">✕</button>
    </div>
    <div class="form-group">
      <label>Your Rating</label>
      <div class="star-rating">
        <input type="radio" name="rating" id="r5" value="5"><label for="r5">★</label>
        <input type="radio" name="rating" id="r4" value="4"><label for="r4">★</label>
        <input type="radio" name="rating" id="r3" value="3" checked><label for="r3">★</label>
        <input type="radio" name="rating" id="r2" value="2"><label for="r2">★</label>
        <input type="radio" name="rating" id="r1" value="1"><label for="r1">★</label>
      </div>
    </div>
    <div class="form-group">
      <label>Mood Tag</label>
      <select id="logMood">
        <option value="">— Select a mood —</option>
        {% for mood in all_moods %}
        <option value="{{ mood }}">{{ mood.replace('-',' ').title() }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Date Watched</label>
      <input type="date" id="logDate">
    </div>
    <div class="form-group">
      <label>Notes (optional)</label>
      <textarea id="logNotes" placeholder="What did you think?"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('logModal')">Cancel</button>
      <button class="btn btn-primary" id="logSubmitBtn" onclick="submitLog()">Save Log</button>
    </div>
  </div>
</div>

<script>
let _activeTmdbId = null;
document.getElementById('logDate').value = new Date().toISOString().split('T')[0];

async function loadRecs() {
  const mood  = document.getElementById('moodFilter').value;
  const genre = document.getElementById('genreFilter').value;
  const statusEl  = document.getElementById('recStatus');
  const resultsEl = document.getElementById('recResults');

  statusEl.innerHTML = `
    <div class="loading" style="flex-direction:column;gap:14px;padding:56px;">
      <div class="spinner" style="width:32px;height:32px;border-width:3px;"></div>
      <div style="color:var(--text2);font-size:.95rem;">
        Fetching movies from TMDB and looking up RT scores…
      </div>
    </div>`;
  resultsEl.innerHTML = '';
  document.getElementById('refreshBtn').style.display = 'none';

  let url = '/api/recommendations';
  const params = [];
  if (mood)  params.push(`mood=${encodeURIComponent(mood)}`);
  if (genre) params.push(`genre=${encodeURIComponent(genre)}`);
  if (params.length) url += '?' + params.join('&');

  let data;
  try {
    data = await api('GET', url);
  } catch (e) {
    statusEl.innerHTML = `<div class="api-banner">⚠️ Could not reach the server. Is it running?</div>`;
    return;
  }

  statusEl.innerHTML = '';

  if (data.error) {
    statusEl.innerHTML = `<div class="api-banner">⚠️ ${data.error}</div>`;
    return;
  }

  if (!Array.isArray(data) || !data.length) {
    resultsEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🎬</div>
        <h2>No results found</h2>
        <p>Try a different mood or genre, or check your TMDB API key.</p>
      </div>`;
    return;
  }

  const label = genre ? genre : (mood ? mood.replace('-',' ') : 'popular');
  resultsEl.innerHTML = `
    <div style="margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
      <div class="text-muted text-sm">
        5 picks from TMDB${genre ? ` · genre: <strong style="color:var(--text2)">${genre}</strong>` : ''}${mood && !genre ? ` · mood: <strong style="color:var(--text2)">${mood.replace('-',' ')}</strong>` : ''}
      </div>
      <button class="btn btn-ghost btn-sm" onclick="loadRecs()">↻ Shuffle</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      ${data.map(renderCard).join('')}
    </div>`;

  document.getElementById('refreshBtn').style.display = 'inline-flex';
}

function renderCard(m) {
  const streaming = (m.streaming_services || []).map(streamingBadge).join(' ');
  const genres = (m.genre || '').split(',').slice(0, 3)
    .map(g => `<span class="badge badge-genre">${esc(g.trim())}</span>`).join(' ');
  const desc = (m.description || '').slice(0, 200) + ((m.description || '').length > 200 ? '…' : '');
  const meta = [m.year, m.director, m.runtime ? m.runtime + ' min' : null].filter(Boolean).join(' · ');

  return `
    <div class="card" style="display:flex;gap:16px;padding:16px;">
      <div style="flex-shrink:0;">
        ${m.poster_url
          ? `<img src="${m.poster_url}" alt="${esc(m.title)}"
               style="width:80px;height:120px;object-fit:cover;border-radius:8px;display:block;">`
          : `<div style="width:80px;height:120px;background:var(--bg3);border-radius:8px;
                         display:flex;align-items:center;justify-content:center;font-size:1.8rem;">🎬</div>`}
      </div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;">
          <div style="font-weight:700;font-size:1.05rem;line-height:1.3;">${esc(m.title)}</div>
          <div style="flex-shrink:0;">${rtBadge(m.rotten_tomatoes_score)}</div>
        </div>
        <div class="text-muted text-sm" style="margin-bottom:8px;">${esc(meta)}</div>
        ${desc ? `<div class="text-sm" style="color:var(--text2);line-height:1.55;margin-bottom:10px;">${esc(desc)}</div>` : ''}
        <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;">
          <div style="display:flex;flex-wrap:wrap;gap:5px;">
            ${genres}
            ${streaming}
          </div>
          <div style="display:flex;gap:8px;flex-shrink:0;margin-top:4px;">
            <button class="btn btn-ghost btn-xs" onclick="addToWatchlist(${m.tmdb_id}, this)">+ Watchlist</button>
            <button class="btn btn-primary btn-xs"
              onclick="openLog(${m.tmdb_id}, '${esc(m.title)}', '${m.year || ''}')">Log</button>
          </div>
        </div>
      </div>
    </div>`;
}

function openLog(tmdbId, title, year) {
  _activeTmdbId = tmdbId;
  document.getElementById('logModalTitle').textContent = title;
  document.getElementById('logModalYear').textContent = year || '';
  document.querySelector('input[name="rating"][value="3"]').checked = true;
  document.getElementById('logMood').value = '';
  document.getElementById('logNotes').value = '';
  document.getElementById('logDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('logModal').classList.add('open');
}
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

async function submitLog() {
  const rating = parseInt(document.querySelector('input[name="rating"]:checked').value);
  const btn = document.getElementById('logSubmitBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const res = await api('POST', '/api/log', {
    tmdb_id:      _activeTmdbId,
    user_rating:  rating,
    mood_tag:     document.getElementById('logMood').value,
    notes:        document.getElementById('logNotes').value,
    watched_date: document.getElementById('logDate').value,
  });
  btn.disabled = false; btn.textContent = 'Save Log';
  if (res.success) { closeModal('logModal'); showToast('Movie logged! ✓'); loadRecs(); }
  else showToast(res.error || 'Failed to log', 'error');
}

async function addToWatchlist(tmdbId, btn) {
  btn.disabled = true; btn.textContent = '…';
  const res = await api('POST', '/api/watchlist/add', { tmdb_id: tmdbId, priority: 3 });
  if (res.success) { btn.textContent = '✓ Listed'; showToast('Added to watchlist!'); }
  else { btn.disabled = false; btn.textContent = '+ Watchlist'; showToast(res.error || 'Failed', 'error'); }
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('logModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal('logModal');
});

document.addEventListener('DOMContentLoaded', loadRecs);
</script>
{% endblock %}
